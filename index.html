<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- #609: Titel und Beschreibung stehen einmal, in public/locales/de/translation.json unter seo.start.
         vite.config.ts setzt sie beim Bau ein (scripts/seo-kopf.mjs). Hier nichts eintragen. -->
    <meta property="og:title" content="{{seo.start.title}}" />
    <meta property="og:description" content="{{seo.start.description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.plinyoo.com/" />
    <meta property="og:image" content="https://www.plinyoo.com/og-image.png" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="plinyoo" />
    <meta name="description" content="{{seo.start.description}}" />
    <meta name="keywords" content="Lernplattform, personalisiertes Lernen, Wissensmanagement, digitales Lernen, Mikro-Learning, Karteikarten, spaced repetition" />
    <meta name="author" content="plinyoo UG" />
    <link rel="canonical" href="https://www.plinyoo.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{seo.start.title}}" />
    <meta name="twitter:description" content="{{seo.start.description}}" />
    <meta name="twitter:image" content="https://www.plinyoo.com/og-image.png" />
    <meta name="twitter:site" content="@plinyoo_path" />

    <!-- Critical CSS - FOUC Prevention -->
    <style>
      /* Prevent FOUC with minimal critical styles */
      html {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F4F5F7;
        color: #141A1F;
        min-height: 100vh;
      }
      #root {
        display: block;
        min-height: 100vh;
      }
      /* Kein Ausblenden des body beim Laden (spoonup#532): Solange die Übersetzung lädt, zeigt
         main.tsx den Ladehinweis — ein unsichtbarer body machte daraus eine leere Seite. */
    </style>
    
    <!-- PWA Manifest entfernt -->
    
    <!-- Android Theme -->
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="plinyoo" />
    
    <!-- iOS PWA Meta-Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="plinyoo" />
    
    <!-- Eigenes Favicon als Data-URL -->
    <link rel="icon" href="/favicon.ico" />

    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://plausible.io 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    font-src 'self' data:;
    img-src 'self' data:;
    connect-src 'self' https://plausible.io https://*.supabase.co;
  ">
    <title>{{seo.start.title}}</title>

    <!-- Scroll-Restoration deaktivieren: Landingpage soll immer oben beginnen, nicht an der alten Scroll-Position -->
    <script>
      try {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
      } catch (e) {}
    </script>

    <!-- #609: alte Adressen (/#/zugang?…) auf die echten (/zugang/?…) umleiten, mit allen Angaben, VOR Plausible,
         damit der Aufruf schon unter dem neuen Pfad gezählt wird. vite.config.ts setzt hier src/lib/alte-adressen.ts ein. -->
    <!--ALTE-ADRESSEN-->

    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa--uQFBayBpH0z77zfdWY78.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      // #609: echte Adressen (/zugang/). Plausible zählt Pfade und Seitenwechsel im Browser (pushState) selbst.
      plausible.init()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--BUECHER-FUSS-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
